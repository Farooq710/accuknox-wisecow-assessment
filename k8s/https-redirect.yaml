apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wisecow-https-redirect
  namespace: default
spec:
  redirectScheme:
    scheme: https
    port: "8443"
    permanent: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow-http-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-wisecow-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wisecow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow-service
                port:
                  number: 80
